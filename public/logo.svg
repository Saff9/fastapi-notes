<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" x="0px" y="0px"
     viewBox="0 0 64 64" xml:space="preserve">
  <defs>
    <linearGradient id="fea-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="55%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="fea-bolt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="fea-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>

  <!-- Hexagonal engineering badge -->
  <path d="M32 3 L57 17.5 L57 46.5 L32 61 L7 46.5 L7 17.5 Z"
        fill="url(#fea-grad)"
        stroke="url(#fea-edge)"
        stroke-width="2.2"
        stroke-linejoin="round"/>

  <!-- Inner subtle facet for depth -->
  <path d="M32 8 L52.5 20 L52.5 44 L32 56 L11.5 44 L11.5 20 Z"
        fill="none"
        stroke="#ffffff"
        stroke-width="0.9"
        stroke-linejoin="round"
        opacity="0.18"/>

  <!-- Lightning bolt that also reads as a pillar / F-stem -->
  <path d="M35.5 12 L21 34 H29.5 L26.5 52 L43 28 H33.5 Z"
        fill="url(#fea-bolt)"
        stroke="#0f766e"
        stroke-width="0.8"
        stroke-linejoin="round"/>

  <!-- Tiny accent dot (graduation / spark) -->
  <circle cx="46" cy="46" r="2.4" fill="#fbbf24" stroke="#0f766e" stroke-width="0.6"/>
</svg>
